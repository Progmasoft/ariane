name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo:
    name: Cargo (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-2025, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rust-toolchain.toml names the version; rustup installs it on first use.
      - name: Install the toolchain
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install

      - name: Format
        if: matrix.os == 'ubuntu-26.04'
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

  without-cargo:
    name: ${{ matrix.build }} without Cargo
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        build: [GNU Make, Meson, Bazel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Criterion
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libcriterion-dev ninja-build

      # Only rustc is installed: a build that reaches for Cargo fails.
      - name: Install rustc
        shell: bash
        run: |
          rustup toolchain install --profile minimal
          rm -f "$(rustup which cargo)"

      - name: GNU Make
        if: matrix.build == 'GNU Make'
        run: make -j"$(nproc)" test

      - name: Meson
        if: matrix.build == 'Meson'
        run: |
          python3 -m venv "$RUNNER_TEMP/meson"
          "$RUNNER_TEMP/meson/bin/pip" install meson==1.12.1
          "$RUNNER_TEMP/meson/bin/meson" setup build/meson
          "$RUNNER_TEMP/meson/bin/meson" test -C build/meson --print-errorlogs

      - name: Bazel
        if: matrix.build == 'Bazel'
        run: bazelisk test //...

  headers:
    name: Headers
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The profile of Progmasoft Core C Coding Guidelines needs clang-format 23.
      - name: Format
        run: |
          python3 -m venv "$RUNNER_TEMP/format"
          "$RUNNER_TEMP/format/bin/pip" install clang-format==23.1.5
          "$RUNNER_TEMP/format/bin/clang-format" --style=file --dry-run --Werror include/ariane/*.h tests/c/*.c

      - name: C11 and C++17
        run: |
          echo '#include "ariane/Ariane.Foundation.h"' > "$RUNNER_TEMP/headers.c"
          cc -std=c11 -pedantic-errors -Wall -Wextra -Werror -Iinclude -fsyntax-only "$RUNNER_TEMP/headers.c"
          c++ -std=c++17 -Wall -Wextra -Werror -Iinclude -fsyntax-only -x c++ "$RUNNER_TEMP/headers.c"

  doxygen:
    name: Doxygen
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends doxygen

      # Every warning fails, an undocumented declaration included.
      - name: Build the reference of the C API
        run: doxygen Doxyfile

      - name: Keep the reference
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ariane-doxygen
          path: doxygen/html/
          if-no-files-found: error
          retention-days: 7

  coverage:
    name: Coverage
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Criterion
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libcriterion-dev

      - name: Install the toolchain and llvm-tools
        run: |
          rustup toolchain install
          rustup component add llvm-tools

      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-llvm-cov@0.9.1

      # The Rust tests and the Criterion tests of the C API, on one library.
      - name: Measure
        run: tools/coverage.sh

      - name: Keep the coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ariane-coverage
          path: build/coverage.lcov
          if-no-files-found: error
          retention-days: 1

  coverage-upload:
    name: Coverage upload
    # Fork pull requests cannot receive the OIDC token Codecov needs.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: coverage
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      # The job that can get a token runs no code of the repository.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ariane-coverage
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          use_oidc: true
          files: coverage.lcov
          fail_ci_if_error: true

  required:
    name: CI Required
    if: always()
    needs: [cargo, without-cargo, headers, doxygen, coverage]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: >-
            ${{ needs.cargo.result }} ${{ needs.without-cargo.result }} ${{ needs.headers.result }}
            ${{ needs.doxygen.result }} ${{ needs.coverage.result }}
        run: test "$RESULTS" = "success success success success success"
