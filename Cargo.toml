[package]
name = "ariane"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "The diagnostics of Ariadne through a C API"
repository = "https://github.com/Progmasoft/ariane"
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
ariadne = "=0.6.0"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
